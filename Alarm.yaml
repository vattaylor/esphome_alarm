#   This ESP Home confit is for David White’s Alarm box interface.
#   This will show in  the Home Assistant:
#        15 Zone with 
#        Zone circuit voltage
#        Number of triggers in the day
#        Trigger status
#        One relay 
#        The power of the voltage of the alarm system. 

#   The trigger threshold voltage can be set from within the device’s 
#   entity form Home Assistant to cater for different alarm systems. 

# System name
esphome:
  name: alarm-panel
  friendly_name: Alarm Panel

# ESP type
esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:

 
ota:
  - platform: esphome

#  WIFI Setup
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Alarm-Panel Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:

#  Setting up day count variables and setting them to 0 on boot
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(zone_1_count) = 0;
              id(zone_2_count) = 0;
              id(zone_3_count) = 0;
              id(zone_4_count) = 0;
              id(zone_5_count) = 0;
              id(zone_6_count) = 0;
              id(zone_7_count) = 0;
              id(zone_8_count) = 0;
              id(zone_9_count) = 0;
              id(zone_10_count) = 0;
              id(zone_11_count) = 0;
              id(zone_12_count) = 0;
              id(zone_13_count) = 0;
              id(zone_14_count) = 0;
              id(zone_15_count) = 0;

# Setting up Relay
switch:
  - platform: gpio
    pin: GPIO04
    name: "Switch Somthing"
    
# MUX setup
cd74hc4067:

  - id: cd74hc4067_1
    pin_s0: GPIO14
    pin_s1: GPIO12
    pin_s2: GPIO13
    pin_s3: GPIO15

# Setting up Zone and battery sensors
sensor:
