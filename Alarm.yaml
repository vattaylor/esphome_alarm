# Zone switch if over threshold and increment count 
binary_sensor:
  - platform: template
    name: "Zone 1 trigger"
    device_class: "occupancy"
    lambda: 'return id(adc_0).state > id(threshold).state;'
    on_press:
      - lambda: 'id(zone_1_count) += 1;'
      
  - platform: template
    name: "Zone 2 trigger"
